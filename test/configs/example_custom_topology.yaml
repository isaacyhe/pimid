simulation:
  name: example_custom_topology_test
  mode: standalone
  duration_cycles: 1000

memory:
  dram_type: DDR4
  channels: 1
  ranks_per_channel: 1
  chips_per_rank: 8
  bg_per_chip: 4
  banks_per_bg: 4
  subarrays_per_bank: 16

  network:
    custom_topology:
      enabled: true

      # L0: H-Tree for banks within BG
      l0:
        use_default: false
        topology: H_TREE
        num_switches: 3
        ports_per_switch: 4
        num_endpoints: 4

      # L1: Bus for BG level
      l1:
        use_default: false
        topology: BUS
        num_switches: 4
        ports_per_switch: 8
        num_endpoints: 16

      # L2: Mesh for chip level
      l2:
        use_default: false
        topology: MESH_2D
        num_switches: 8
        ports_per_switch: 5
        num_endpoints: 8

      # L3-L5: Use defaults
      l3:
        use_default: true

      l4:
        use_default: true

      l5:
        use_default: true

external_models:
  network:
    enabled: false

  memory:
    enabled: false

pim:
  enabled: true
  num_pes: 128
  pe_placement: bank
  scheduling_policy: nearest

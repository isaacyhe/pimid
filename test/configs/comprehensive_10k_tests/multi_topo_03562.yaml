simulation:
  name: multi_topo_03562
  mode: standalone
  duration_cycles: 10000
  workload: build/test/workloads/test_pim_workloads
memory:
  dram_type: DDR5
  channels: 4
  ranks_per_channel: 2
  chips_per_rank: 8
  bg_per_chip: 8
  banks_per_bg: 4
  subarrays_per_bank: 32
  network:
    custom_topology:
      enabled: true
      l0:
        use_default: true
      l1:
        use_default: true
      l2:
        use_default: false
        topology: FAT_TREE
        num_switches: 8
        ports_per_switch: 4
        num_endpoints: 8
      l3:
        use_default: true
      l4:
        use_default: true
      l5:
        use_default: false
        topology: H_TREE
        num_switches: 3
        ports_per_switch: 4
        num_endpoints: 4
pim:
  enabled: true
  num_pes: 8
  pe_placement: rank
  scheduling_policy: data_aware
  core_model: simple

simulation:
  name: single_topo_02149
  mode: standalone
  duration_cycles: 10000
  workload: build/test/workloads/test_pim_workloads
memory:
  dram_type: HBM2
  channels: 16
  ranks_per_channel: 2
  chips_per_rank: 4
  bg_per_chip: 4
  banks_per_bg: 4
  subarrays_per_bank: 16
  network:
    custom_topology:
      enabled: true
      l0:
        use_default: true
      l1:
        use_default: true
      l2:
        use_default: true
      l3:
        use_default: false
        topology: MESH_2D
        num_switches: 4
        ports_per_switch: 5
        num_endpoints: 2
      l4:
        use_default: true
      l5:
        use_default: true
pim:
  enabled: true
  num_pes: 128
  pe_placement: chip
  scheduling_policy: data_aware
  core_model: out-of-order

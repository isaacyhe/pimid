  network:
    custom_topology:
      enabled: true
      l0:
        use_default: true
      l1:
        use_default: true
      l2:
        use_default: true
      l3:
        use_default: true
      l4:
        use_default: true
      l5:
        use_default: false
        topology: TORUS_2D
        num_switches: 4
        ports_per_switch: 5
        num_endpoints: 2
pim:
  enabled: true
  num_pes: 8
  pe_placement: chip
  scheduling_policy: round_robin
  core_model: out-of-order

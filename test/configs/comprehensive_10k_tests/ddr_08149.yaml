simulation:
  name: ddr_08149
  mode: standalone
  duration_cycles: 10000
  workload: build/test/workloads/test_pim_workloads
memory:
  dram_type: DDR4
  channels: 2
  ranks_per_channel: 2
  chips_per_rank: 8
  bg_per_chip: 4
  banks_per_bg: 4
  subarrays_per_bank: 16
  network:
    custom_topology:
      enabled: true
      l0:
        use_default: false
        topology: CROSSBAR
        num_switches: 1
        ports_per_switch: 4
        num_endpoints: 4
      l1:
        use_default: false
        topology: BUS
        num_switches: 1
        ports_per_switch: 16
        num_endpoints: 16
      l2:
        use_default: false
        topology: H_TREE
        num_switches: 7
        ports_per_switch: 4
        num_endpoints: 8
      l3:
        use_default: true
      l4:
        use_default: true
      l5:
        use_default: true
pim:
  enabled: true
  num_pes: 32
  pe_placement: chip
  scheduling_policy: nearest
  core_model: out-of-order

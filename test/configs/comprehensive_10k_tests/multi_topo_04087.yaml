simulation:
  name: multi_topo_04087
  mode: standalone
  duration_cycles: 10000
  workload: build/test/workloads/test_pim_workloads
memory:
  dram_type: DDR5
  channels: 8
  ranks_per_channel: 2
  chips_per_rank: 16
  bg_per_chip: 8
  banks_per_bg: 4
  subarrays_per_bank: 32
  network:
    custom_topology:
      enabled: true
      l0:
        use_default: true
      l1:
        use_default: false
        topology: FAT_TREE
        num_switches: 32
        ports_per_switch: 4
        num_endpoints: 32
      l2:
        use_default: true
      l3:
        use_default: false
        topology: FAT_TREE
        num_switches: 2
        ports_per_switch: 4
        num_endpoints: 2
      l4:
        use_default: false
        topology: H_TREE
        num_switches: 7
        ports_per_switch: 4
        num_endpoints: 8
      l5:
        use_default: true
pim:
  enabled: true
  num_pes: 256
  pe_placement: chip
  scheduling_policy: priority_based
  core_type: out-of-order

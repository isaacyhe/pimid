simulation:
  name: single_topo_02303
  mode: standalone
  duration_cycles: 10000
  workload: build/test/workloads/test_pim_workloads
memory:
  dram_type: LPDDR5
  channels: 4
  ranks_per_channel: 1
  chips_per_rank: 8
  bg_per_chip: 8
  banks_per_bg: 4
  subarrays_per_bank: 16
  network:
    custom_topology:
      enabled: true
      l0:
        use_default: true
      l1:
        use_default: false
        topology: CROSSBAR
        num_switches: 2
        ports_per_switch: 16
        num_endpoints: 32
      l2:
        use_default: true
      l3:
        use_default: true
      l4:
        use_default: true
      l5:
        use_default: true
pim:
  enabled: true
  num_pes: 16384
  pe_placement: subarray
  scheduling_policy: nearest
  core_model: out-of-order

simulation:
  name: multi_topo_03077
  mode: standalone
  duration_cycles: 10000
  workload: build/test/workloads/test_pim_workloads
memory:
  dram_type: DDR5
  channels: 8
  ranks_per_channel: 2
  chips_per_rank: 16
  bg_per_chip: 8
  banks_per_bg: 4
  subarrays_per_bank: 32
  network:
    custom_topology:
      enabled: true
      l0:
        use_default: false
        topology: FAT_TREE
        num_switches: 4
        ports_per_switch: 4
        num_endpoints: 4
      l1:
        use_default: true
      l2:
        use_default: true
      l3:
        use_default: true
      l4:
        use_default: false
        topology: MESH_2D
        num_switches: 9
        ports_per_switch: 5
        num_endpoints: 8
      l5:
        use_default: false
        topology: TORUS_2D
        num_switches: 9
        ports_per_switch: 5
        num_endpoints: 8
pim:
  enabled: true
  num_pes: 256
  pe_placement: chip
  scheduling_policy: data_aware
  core_type: out-of-order

simulation:
  name: multi_topo_03030
  mode: standalone
  duration_cycles: 10000
  workload: build/test/workloads/test_pim_workloads
memory:
  dram_type: DDR4
  channels: 4
  ranks_per_channel: 2
  chips_per_rank: 16
  bg_per_chip: 4
  banks_per_bg: 4
  subarrays_per_bank: 32
  network:
    custom_topology:
      enabled: true
      l0:
        use_default: false
        topology: H_TREE
        num_switches: 3
        ports_per_switch: 4
        num_endpoints: 4
      l1:
        use_default: false
        topology: TORUS_2D
        num_switches: 16
        ports_per_switch: 5
        num_endpoints: 16
      l2:
        use_default: true
      l3:
        use_default: false
        topology: MESH_2D
        num_switches: 4
        ports_per_switch: 5
        num_endpoints: 2
      l4:
        use_default: true
      l5:
        use_default: false
        topology: H_TREE
        num_switches: 3
        ports_per_switch: 4
        num_endpoints: 4
pim:
  enabled: true
  num_pes: 8
  pe_placement: rank
  scheduling_policy: round_robin
  core_type: simple

# Host Processor Configuration
# Conventional CPU simulation parameters

processor:
  name: "Host_Processor"

  # Core configuration
  cores:
    - core_id: 0
      num_threads: 1
      frequency_mhz: 3000
      core_type: "out-of-order"
      pipeline_depth: 14
      issue_width: 4

    - core_id: 1
      num_threads: 1
      frequency_mhz: 3000
      core_type: "out-of-order"
      pipeline_depth: 14
      issue_width: 4

    - core_id: 2
      num_threads: 1
      frequency_mhz: 3000
      core_type: "out-of-order"
      pipeline_depth: 14
      issue_width: 4

    - core_id: 3
      num_threads: 1
      frequency_mhz: 3000
      core_type: "out-of-order"
      pipeline_depth: 14
      issue_width: 4

# Cache hierarchy
cache:
  l1i:
    size_kb: 32
    line_size: 64
    associativity: 8
    latency_cycles: 4

  l1d:
    size_kb: 32
    line_size: 64
    associativity: 8
    latency_cycles: 4

  l2:
    size_kb: 256
    line_size: 64
    associativity: 8
    latency_cycles: 12
    private: true  # Private per core

  l3:
    size_kb: 8192
    line_size: 64
    associativity: 16
    latency_cycles: 30
    shared: true  # Shared across all cores

# Memory controller
memory_controller:
  num_controllers: 1
  queue_depth: 64
  scheduling_policy: "FR-FCFS"  # First-Ready FCFS

# Address translation
address_translation:
  page_size_bytes: 4096
  tlb_entries: 64
  tlb_associativity: 4
  tlb_hit_latency: 1
  page_walk_latency: 20

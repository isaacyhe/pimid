# ReRAM (Resistive RAM) Configuration
# Default configuration for ReRAM-based PIM benchmarks

memory:
  technology: "ReRAM"
  model: "NVSim"

  # ReRAM organization
  capacity: 268435456  # 256 MB
  num_banks: 8
  num_subarrays_per_bank: 16
  num_bank_groups: 2
  num_chips: 1

  # Technology parameters
  technology:
    node_nm: 22  # 22nm technology
    cell_type: "ReRAM"
    line_size: 64

  # Timing parameters (in nanoseconds)
  timing:
    read_latency: 15   # Fast reads
    write_latency: 100  # Slower writes (filament formation)
    access_time: 15
    cycle_time: 3.0    # 333 MHz

  # Bandwidth
  bus_width_bits: 64
  frequency_ghz: 1.4

  # Energy per access (in pJ)
  energy:
    read_energy_pj: 250   # Low read energy
    write_energy_pj: 6000  # High write energy (SET/RESET)
    leakage_power_mw: 3   # Very low leakage

  # Endurance
  endurance:
    max_write_cycles: 1000000000  # ~10^9 cycles

# NVSim-specific configuration
nvsim:
  enable_power_modeling: true
  cell_type: "RRAM"
  access_mode: "CMOS"

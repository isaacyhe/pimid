# SRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: SRAM (Small - 256KB L2 cache size)
# Topology: H-tree (hierarchical tree for bank interconnect)

memory:
  type: "SRAM"
  organization:
    capacity: 262144  # 256 KB
    num_banks: 4
    num_subarrays: 8
    num_bank_groups: 1  # SRAM typically no bank groups
    num_chips: 1        # On-chip

  # Timing parameters (ns)
  timing:
    access_time: 0.8   # Fast on-chip SRAM
    cycle_time: 0.4    # 2.5 GHz

  # Technology
  technology:
    node_nm: 22
    line_size: 64
    associativity: 8   # 8-way set associative

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks (VN) - Message Classes
  # For SRAM: Read/Write paths
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  # Virtual Channels (VC) per VN - Deadlock Avoidance
  # H-trees are deadlock-free (acyclic)
  virtual_channels_per_vn: 1

  # Router Pipeline Complexity
  # MINIMAL: Just mux/switch (1-stage: ST only)
  # Perfect for on-chip SRAM interconnects
  router_pipeline: "MINIMAL"

  # Router latency (cycles)
  router_latency: 1  # 1 cycle for mux switching

  # Router bypass optimization
  enable_router_bypass: true

  # Buffer depths (minimal for on-chip)
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Subarray level (on-chip, very fast)
  subarray_network:
    link_width_bits: 128   # Wide on-chip paths
    frequency_GHz: 2.5     # High frequency
    latency_cycles: 1      # Very low latency

  # Link parameters - Bank level
  bank_network:
    link_width_bits: 64
    frequency_GHz: 2.5
    latency_cycles: 2

  # Link parameters - Chip level
  chip_network:
    link_width_bits: 32
    frequency_GHz: 2.5
    latency_cycles: 4

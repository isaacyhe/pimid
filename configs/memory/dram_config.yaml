# DRAM Memory Configuration
# Ramulator-based DRAM timing and power parameters

memory:
  technology: "DRAM"
  model: "Ramulator"

  # DRAM standard and organization
  standard: "DDR4"  # DDR3 | DDR4 | GDDR5 | HBM | HBM2
  organization: "4Gb_x8"  # Chip organization

  # System configuration
  channels: 1
  ranks_per_channel: 4
  banks_per_rank: 16
  rows_per_bank: 65536
  columns_per_row: 1024

  # Capacity
  total_capacity_gb: 16

  # Timing parameters (in nanoseconds)
  timing:
    tCK: 1.25      # Clock cycle time
    tCL: 14        # CAS latency
    tRCD: 14       # RAS to CAS delay
    tRP: 14        # Row precharge time
    tRAS: 32       # Row active time
    tRC: 46        # Row cycle time
    tRFC: 350      # Refresh cycle time
    tWR: 15        # Write recovery time
    tRTP: 7.5      # Read to precharge
    tCCD: 5        # CAS to CAS delay

  # Bandwidth
  bus_width_bits: 64
  data_rate_mts: 3200  # MT/s

  # Power parameters (in mW)
  power:
    VDD: 1.2  # Voltage
    IDD0: 60  # Active precharge current
    IDD2N: 32 # Precharge standby current
    IDD3N: 37 # Active standby current
    IDD4R: 130 # Read burst current
    IDD4W: 135 # Write burst current
    IDD5: 185  # Refresh current

  # Energy per access (in pJ)
  energy:
    read_energy_pj: 500
    write_energy_pj: 600
    activation_energy_pj: 300
    precharge_energy_pj: 200

# Ramulator-specific configuration
ramulator:
  config_file: "configs/memory/ramulator_ddr4.cfg"
  enable_row_buffer: true
  row_buffer_policy: "open_page"  # open_page | close_page
  scheduling_policy: "FRFCFS"     # FCFS | FRFCFS
  queue_structure: "per_bank"
  request_queue_depth: 128

# ReRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: ReRAM (Resistive RAM - Standard)
# Topology: H-tree (hierarchical tree for bank interconnect)
# Key Feature: Moderate asymmetry, better than PCM

memory:
  type: "ReRAM"
  organization:
    capacity: 268435456  # 256 MB
    num_banks: 8
    num_subarrays: 16
    num_bank_groups: 2
    num_chips: 1

  # Timing parameters (ns)
  timing:
    read_latency: 5.0    # Good read latency
    write_latency: 20.0  # Moderate write (SET/RESET operations)
    cycle_time: 0.71     # 1.4 GHz

  # Technology
  technology:
    node_nm: 28
    endurance: 1e10      # Good endurance
    retention_years: 10

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  virtual_channels_per_vn: 1

  # Router Pipeline - MINIMAL
  router_pipeline: "MINIMAL"
  router_latency: 1
  enable_router_bypass: true

  # Buffer depths
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Moderate performance
  subarray_network:
    link_width_bits: 64
    frequency_GHz: 1.4
    latency_cycles: 3

  bank_network:
    link_width_bits: 16
    frequency_GHz: 1.4
    latency_cycles: 7

  bank_group_network:
    link_width_bits: 32
    frequency_GHz: 1.4
    latency_cycles: 14

  chip_network:
    link_width_bits: 16
    frequency_GHz: 1.4
    latency_cycles: 28

# STT-MRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: STT-MRAM (Standard configuration)
# Topology: H-tree (hierarchical tree for bank interconnect)
# Key Feature: Asymmetric read/write (write >> read due to MTJ switching)

memory:
  type: "STT-MRAM"
  organization:
    capacity: 134217728  # 128 MB
    num_banks: 8
    num_subarrays: 16
    num_bank_groups: 2
    num_chips: 1

  # Timing parameters (ns)
  timing:
    read_latency: 3.5    # Fast read (sensing MTJ resistance)
    write_latency: 15.0  # Slow write (MTJ switching time)
    cycle_time: 0.67     # 1.5 GHz

  # Technology
  technology:
    node_nm: 28
    endurance: 1e15      # Very high endurance
    retention_years: 10

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks (VN) - CRITICAL for STT-MRAM!
  # Separate read/write paths due to asymmetric latency
  virtual_networks: 2  # VN0: Reads (fast), VN1: Writes (slow)

  # Virtual Channels (VC) per VN
  virtual_channels_per_vn: 1

  # Router Pipeline - MINIMAL for memory
  router_pipeline: "MINIMAL"
  router_latency: 1
  enable_router_bypass: true

  # Buffer depths
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Moderate for NVM
  subarray_network:
    link_width_bits: 64    # Moderate width
    frequency_GHz: 1.5
    latency_cycles: 3

  bank_network:
    link_width_bits: 16
    frequency_GHz: 1.5
    latency_cycles: 6

  bank_group_network:
    link_width_bits: 32
    frequency_GHz: 1.5
    latency_cycles: 12

  chip_network:
    link_width_bits: 16
    frequency_GHz: 1.5
    latency_cycles: 25

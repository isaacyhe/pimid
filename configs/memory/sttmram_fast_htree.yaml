# STT-MRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: STT-MRAM (Fast variant - optimized MTJ)
# Topology: H-tree (hierarchical tree for bank interconnect)
# Key Feature: Faster write due to improved MTJ switching

memory:
  type: "STT-MRAM"
  organization:
    capacity: 268435456  # 256 MB
    num_banks: 16
    num_subarrays: 32
    num_bank_groups: 4
    num_chips: 1

  # Timing parameters (ns) - Faster than standard
  timing:
    read_latency: 2.5    # Optimized sensing
    write_latency: 10.0  # Improved MTJ switching
    cycle_time: 0.5      # 2.0 GHz

  # Technology
  technology:
    node_nm: 14          # Advanced node
    endurance: 1e16
    retention_years: 10

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks - Critical for asymmetric R/W
  virtual_networks: 2  # VN0: Fast reads, VN1: Slower writes

  virtual_channels_per_vn: 1

  # Router Pipeline - MINIMAL
  router_pipeline: "MINIMAL"
  router_latency: 1
  enable_router_bypass: true

  # Buffer depths
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Faster variant
  subarray_network:
    link_width_bits: 64
    frequency_GHz: 2.0    # Higher frequency
    latency_cycles: 2     # Lower latency

  bank_network:
    link_width_bits: 16
    frequency_GHz: 2.0
    latency_cycles: 4

  bank_group_network:
    link_width_bits: 32
    frequency_GHz: 2.0
    latency_cycles: 8

  chip_network:
    link_width_bits: 16
    frequency_GHz: 2.0
    latency_cycles: 16

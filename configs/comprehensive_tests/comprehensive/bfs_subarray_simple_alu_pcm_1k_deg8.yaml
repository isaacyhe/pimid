# BFS Benchmark Configuration - Auto-generated
# Placement: SUBARRAY, PE: Simple ALU, Memory: PCM
# Workload: Tiny (1024 vertices, degree 8)

benchmark:
  name: "BFS_SUBARRAY_SimpleALU_PCM"
  description: "BFS with SUBARRAY-level Simple ALU PE on PCM"
  workload_type: "bfs"

# Workload parameters
workload:
  graph:
    num_vertices: 1024
    avg_degree: 8
    topology: "random"

  bfs:
    root_vertex: 0
    traversal_mode: "level_synchronous"

# Memory configuration
memory:
  technology: "PCM"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4

  # Memory timing characteristics
  timing:
    subarray_read_ns: 8.0
    subarray_write_ns: 100.0
    inner_bank_htree_ns: 8.65

# Processing element configuration
processing_element:
  type: "simple_alu"
  placement_level: "SUBARRAY"
  num_pes: 16

  # Simple ALU specifications
  timing:
    compare_ns: 0.3
    alu_ns: 0.5
    load_ns: 0.5

  energy:
    alu_pj: 2.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/bfs_subarray_simple_alu_pcm_1k_deg8_stats.txt"
  detailed_log: "results/bfs_subarray_simple_alu_pcm_1k_deg8_detailed.log"
  summary_format: "table"

# Test metadata
metadata:
  placement_level: "subarray"
  pe_type: "simple_alu"
  memory_tech: "pcm"
  workload_size: "tiny"
  graph_degree: 8
  auto_generated: true

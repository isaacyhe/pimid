# BFS Benchmark Configuration - Bank-Level with In-Order Core PE
# Memory Technology: STT-MRAM

benchmark:
  name: "BFS_Bank_InOrder_STT_MRAM"
  description: "BFS with bank-level In-Order Core PE on STT-MRAM"
  workload_type: "bfs"

# Workload parameters
workload:
  graph:
    num_vertices: 262144  # 256K vertices
    avg_degree: 16
    topology: "random"

  bfs:
    root_vertex: 0
    traversal_mode: "level_synchronous"

# Memory configuration
memory:
  technology: "STT_MRAM"
  config_file: "configs/memory/sttmram_config.yaml"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4

  # STT-MRAM-specific timing (write asymmetry: 3.57x)
  timing:
    subarray_read_ns: 7.0
    subarray_write_ns: 25.0
    inner_bank_htree_ns: 7.3

# Processing element configuration
processing_element:
  type: "in_order_core"
  placement_level: "BANK"
  num_pes: 4  # One per bank

  pipeline:
    stages: 5
    fetch_decode_ns: 2.0
    execute_compare_ns: 1.0
    execute_alu_ns: 1.0
    memory_access_ns: 1.0
    writeback_ns: 0.5
    branch_penalty_ns: 3.0
    branch_prediction_accuracy: 0.5

  energy:
    fetch_decode_pj: 10.0
    alu_pj: 5.0
    branch_pj: 8.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/bfs_bank_inorder_sttmram_stats.txt"
  detailed_log: "results/bfs_bank_inorder_sttmram_detailed.log"
  summary_format: "table"

# SPMV Benchmark Configuration - Bank-Level with In-Order Core PE
# Memory Technology: PCM

benchmark:
  name: "SPMV_Bank_InOrder_PCM"
  description: "Sparse Matrix-Vector Multiply with bank-level In-Order Core PE on PCM"
  workload_type: "spmv"

# Workload parameters
workload:
  matrix:
    num_rows: 65536  # 64K rows
    num_cols: 65536
    sparsity: 0.95  # 95% sparse
    format: "CSR"

  spmv:
    num_iterations: 10

# Memory configuration
memory:
  technology: "PCM"
  config_file: "configs/memory/pcm_config.yaml"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4
  # PCM-specific timing
  timing:
    subarray_read_ns: 8.0
    subarray_write_ns: 100.0
    inner_bank_htree_ns: 8.65

# Processing element configuration
processing_element:
  type: "in_order_core"
  placement_level: "BANK"
  num_pes: 4  # One per bank

  pipeline:
    stages: 5
    fetch_decode_ns: 2.0
    execute_compare_ns: 1.0
    execute_alu_ns: 1.0
    memory_access_ns: 1.0
    writeback_ns: 0.5
    branch_penalty_ns: 3.0
    branch_prediction_accuracy: 0.5

  energy:
    fetch_decode_pj: 10.0
    alu_pj: 5.0
    branch_pj: 8.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/spmv_bank_inorder_pcm_stats.txt"
  detailed_log: "results/spmv_bank_inorder_pcm_detailed.log"
  summary_format: "table"

# BFS Benchmark Configuration - Auto-generated
# Placement: RANK, PE: In-Order Core, Memory: STT_MRAM
# Workload: Medium (16384 vertices, degree 16)

benchmark:
  name: "BFS_RANK_In-OrderCore_STT_MRAM"
  description: "BFS with RANK-level In-Order Core PE on STT_MRAM"
  workload_type: "bfs"

# Workload parameters
workload:
  graph:
    num_vertices: 16384
    avg_degree: 16
    topology: "random"

  bfs:
    root_vertex: 0
    traversal_mode: "level_synchronous"

# Memory configuration
memory:
  technology: "STT_MRAM"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4

  # Memory timing characteristics
  timing:
    subarray_read_ns: 7.0
    subarray_write_ns: 25.0
    inner_bank_htree_ns: 7.3

# Processing element configuration
processing_element:
  type: "in_order_core"
  placement_level: "RANK"
  num_pes: 1

  # In-Order Core specifications
  pipeline:
    stages: 5
    fetch_decode_ns: 2.0
    execute_compare_ns: 1.0
    execute_alu_ns: 1.0
    memory_access_ns: 1.0
    writeback_ns: 0.5
    branch_penalty_ns: 3.0
    branch_prediction_accuracy: 0.5

  energy:
    fetch_decode_pj: 10.0
    alu_pj: 5.0
    branch_pj: 8.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/bfs_rank_inorder_sttmram_16k_deg16_stats.txt"
  detailed_log: "results/bfs_rank_inorder_sttmram_16k_deg16_detailed.log"
  summary_format: "table"

# Test metadata
metadata:
  placement_level: "rank"
  pe_type: "inorder"
  memory_tech: "sttmram"
  workload_size: "medium"
  graph_degree: 16
  auto_generated: true

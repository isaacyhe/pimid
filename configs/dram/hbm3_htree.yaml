# HBM3 DRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: HBM3 (High Bandwidth Memory Gen 3)
# Topology: H-tree (hierarchical tree for subarray interconnect)
# 3D-stacked with TSVs (Through-Silicon Vias)

dram:
  type: "HBM3"
  organization:
    num_subarrays: 32  # HBM3 has more subarrays
    num_banks: 4
    num_bank_groups: 4
    num_chips: 8

  # Timing parameters (ns)
  timing:
    tCK: 0.25      # HBM3 ~4 GHz
    tCL: 16        # CAS latency
    tRCD: 16       # RAS to CAS delay
    tRP: 16        # Precharge time
    tRAS: 32       # Row active time

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks (VN) - Message Classes
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  # Virtual Channels (VC) per VN - Deadlock Avoidance
  virtual_channels_per_vn: 1

  # Router Pipeline Complexity - MINIMAL for DRAM
  router_pipeline: "MINIMAL"

  # Router latency (cycles)
  router_latency: 1

  # Router bypass optimization
  enable_router_bypass: true

  # Buffer depths (minimal for DRAM)
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Subarray level (ULTRA-wide for HBM3)
  subarray_network:
    link_width_bits: 2048  # HBM3: Ultra-wide for extreme bandwidth
    frequency_GHz: 4.0
    latency_cycles: 2

  # Link parameters - Bank level
  bank_network:
    link_width_bits: 512
    frequency_GHz: 4.0
    latency_cycles: 4

  # Link parameters - Bank Group level
  bank_group_network:
    link_width_bits: 512
    frequency_GHz: 4.0
    latency_cycles: 6

  # Link parameters - Chip level (improved TSV latency)
  chip_network:
    link_width_bits: 512
    frequency_GHz: 4.0
    latency_cycles: 3

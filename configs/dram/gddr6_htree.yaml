# GDDR6 DRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: GDDR6 (Graphics DDR for GPUs)
# Topology: H-tree (hierarchical tree for subarray interconnect)

dram:
  type: "GDDR6"
  organization:
    num_subarrays: 16
    num_banks: 4
    num_bank_groups: 4
    num_chips: 2  # Dual channel typical for GDDR6

  # Timing parameters (ns)
  timing:
    tCK: 0.125     # GDDR6 ~8 GHz effective
    tCL: 14        # CAS latency
    tRCD: 14       # RAS to CAS delay
    tRP: 14        # Precharge time
    tRAS: 28       # Row active time

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks (VN) - Message Classes
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  # Virtual Channels (VC) per VN - Deadlock Avoidance
  virtual_channels_per_vn: 1

  # Router Pipeline Complexity - MINIMAL for DRAM
  router_pipeline: "MINIMAL"

  # Router latency (cycles)
  router_latency: 1

  # Router bypass optimization
  enable_router_bypass: true

  # Buffer depths (minimal for DRAM)
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Subarray level (very wide for graphics)
  subarray_network:
    link_width_bits: 256   # GDDR6: Very wide internal buses
    frequency_GHz: 2.0     # High frequency for graphics
    latency_cycles: 3      # Low latency for texture/framebuffer

  # Link parameters - Bank level
  bank_network:
    link_width_bits: 32    # Wider banks for graphics bandwidth
    frequency_GHz: 2.0
    latency_cycles: 6

  # Link parameters - Bank Group level
  bank_group_network:
    link_width_bits: 32
    frequency_GHz: 2.0
    latency_cycles: 9

  # Link parameters - Chip level
  chip_network:
    link_width_bits: 32
    frequency_GHz: 2.0
    latency_cycles: 12

# HBM2 DRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: HBM2 (High Bandwidth Memory Gen 2)
# Topology: H-tree (hierarchical tree for subarray interconnect)
# 3D-stacked with TSVs (Through-Silicon Vias)

dram:
  type: "HBM2"
  organization:
    num_subarrays: 16
    num_banks: 4   # HBM2 has more banks than HBM
    num_bank_groups: 4
    num_chips: 8

  # Timing parameters (ns)
  timing:
    tCK: 0.5       # HBM2 ~2 GHz
    tCL: 14        # CAS latency
    tRCD: 14       # RAS to CAS delay
    tRP: 14        # Precharge time
    tRAS: 28       # Row active time

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks (VN) - Message Classes
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  # Virtual Channels (VC) per VN - Deadlock Avoidance
  virtual_channels_per_vn: 1

  # Router Pipeline Complexity - MINIMAL for DRAM
  router_pipeline: "MINIMAL"

  # Router latency (cycles)
  router_latency: 1

  # Router bypass optimization
  enable_router_bypass: true

  # Buffer depths (minimal for DRAM)
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Subarray level (VERY wide due to TSVs)
  subarray_network:
    link_width_bits: 1024  # HBM2: Even wider than HBM
    frequency_GHz: 2.0
    latency_cycles: 3

  # Link parameters - Bank level
  bank_network:
    link_width_bits: 256
    frequency_GHz: 2.0
    latency_cycles: 6

  # Link parameters - Bank Group level
  bank_group_network:
    link_width_bits: 256
    frequency_GHz: 2.0
    latency_cycles: 9

  # Link parameters - Chip level (TSV latency)
  chip_network:
    link_width_bits: 256
    frequency_GHz: 2.0
    latency_cycles: 4

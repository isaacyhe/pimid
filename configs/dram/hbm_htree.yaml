# HBM DRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: HBM (High Bandwidth Memory Gen 1)
# Topology: H-tree (hierarchical tree for subarray interconnect)
# 3D-stacked with TSVs (Through-Silicon Vias)

dram:
  type: "HBM"
  organization:
    num_subarrays: 16
    num_banks: 2   # HBM has fewer banks per stack
    num_bank_groups: 4
    num_chips: 8   # 8 stacks typical

  # Timing parameters (ns)
  timing:
    tCK: 1.0       # HBM ~1 GHz
    tCL: 12        # CAS latency
    tRCD: 12       # RAS to CAS delay
    tRP: 12        # Precharge time
    tRAS: 24       # Row active time

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks (VN) - Message Classes
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  # Virtual Channels (VC) per VN - Deadlock Avoidance
  virtual_channels_per_vn: 1

  # Router Pipeline Complexity - MINIMAL for DRAM
  router_pipeline: "MINIMAL"

  # Router latency (cycles)
  router_latency: 1

  # Router bypass optimization
  enable_router_bypass: true

  # Buffer depths (minimal for DRAM)
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Subarray level (VERY wide due to TSVs)
  subarray_network:
    link_width_bits: 512   # HBM: Ultra-wide TSV interconnects
    frequency_GHz: 1.0
    latency_cycles: 3

  # Link parameters - Bank level
  bank_network:
    link_width_bits: 128   # Wide internal paths
    frequency_GHz: 1.0
    latency_cycles: 6

  # Link parameters - Bank Group level
  bank_group_network:
    link_width_bits: 128
    frequency_GHz: 1.0
    latency_cycles: 9

  # Link parameters - Chip level (TSV latency)
  chip_network:
    link_width_bits: 128
    frequency_GHz: 1.0
    latency_cycles: 4  # Low TSV latency

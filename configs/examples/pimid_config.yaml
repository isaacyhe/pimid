# PIMID Main Configuration
# Full-system PIM simulator configuration

simulation:
  name: "PIMID_Simulation"
  description: "Processing-in-Memory full-system simulation"

  # Simulation mode
  mode: "co-simulation"  # co-simulation | standalone

  # Configuration file paths
  host_config: "configs/host/host_config.yaml"
  device_config: "configs/device/device_config.yaml"
  memory_config: "configs/memory/dram_config.yaml"
  network_config: "configs/network/network_config.yaml"
  power_config: "configs/power/power_config.yaml"

# Memory technology selection
memory:
  technology: "DRAM"  # DRAM | SRAM | STT_MRAM
  addressing_mode: "unified"  # unified | discrete

# PE placement configuration
pe_placement:
  level: "RANK"  # SUBARRAY | BANK | CHIP | RANK | LOGIC_DIE
  num_pes_per_level: 4

# Communication settings (for co-simulation)
communication:
  port: 50000
  host_address: "127.0.0.1"
  timeout_ms: 10000

# Feature flags
features:
  enable_power_modeling: true
  enable_network_modeling: true
  enable_coherence: true
  enable_address_translation: true

# Simulation control
control:
  max_cycles: 1000000000  # 1 billion cycles
  stats_interval: 1000000  # Print stats every 1M cycles
  checkpoint_interval: 10000000  # Checkpoint every 10M cycles

# Output configuration
output:
  stats_file: "results/stats.txt"
  trace_file: "results/trace.out"
  log_file: "results/simulation.log"
  log_level: "INFO"  # DEBUG | INFO | WARNING | ERROR

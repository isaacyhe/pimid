// ZSim Configuration: SAXPY with 16 In-Order Core PEs
// Matches PIMID 4x4 mesh with 16 STT-MRAM banks

sys = {
    lineSize = 64;
    frequency = 2000;      // 2 GHz (matches config)

    cores = {
        // 16 In-Order PIM Processing Elements (one per bank)
        pim_pes = {
            type = "Simple";   // In-order core
            cores = 16;        // 16 PEs for 16 banks
        };
    };

    caches = {
        l1d = {
            size = 32768;      // 32KB L1D per PE
            ways = 8;
        };
        l1i = {
            size = 16384;      // 16KB L1I per PE
            ways = 4;
        };
    };

    mem = {
        type = "Simple";
        latency = 20;   // STT-MRAM latency ~7ns @ 2GHz
    };
};

sim = {
    phaseLength = 10000;
    maxTotalInstrs = 100000000L;  // 100M instructions max
    statsPhaseInterval = 10000;
    printHierarchy = true;
    aslr = false;
};

// SAXPY workload
process0 = {
    command = "../workloads/simple_saxpy 1048576 10 16";  // 1M elements, 10 iters, 16 threads
};

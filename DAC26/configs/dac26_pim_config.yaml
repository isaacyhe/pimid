# DAC26 PIM Workload Configuration
# Technology-aware parameters for PIMID-integrated workloads

technology:
  node_nm: 45           # Technology node in nm
  frequency_ghz: 1.0    # Operating frequency
  temperature_k: 350.0  # Operating temperature

architecture:
  num_subarrays: 8
  subarray_size_kb: 4   # 4KB per subarray
  word_size_bits: 32

# Memory timing parameters (cycles)
# Derived from DRAM specifications (DDR4-like at 1GHz)
timing:
  local_read_cycles: 12     # Row activation + column read
  local_write_cycles: 15    # Row activation + column write + precharge
  compute_cycles: 1         # ALU operation cycles

  # Network timing for interconnects
  htree_base_latency: 2     # Base H-tree latency
  libcom_transfer_cycles: 1 # Direct interconnect transfer

# Energy parameters (pJ per 32-bit operation)
# Based on CACTI/McPAT models for 45nm, 1GHz
energy:
  # Local subarray access (SRAM-like)
  local_read_pj: 8.0
  local_write_pj: 12.0
  compute_pj: 2.0

  # Network energy
  htree_wire_energy_base_pj: 10.0  # Per hop

  # Topology factors
  libcom_energy_factor: 0.55   # 45% energy savings (0.55 = uses 55% of baseline)

  # Atomic/sync operations
  atomic_overhead_cycles: 2
  atomic_energy_multiplier: 1.5
  barrier_sync_cycles: 10
  barrier_sync_energy_pj: 5.0

# Topology configuration
topology:
  # H-tree baseline: through bank port/peripheral
  # LIBCom: direct interconnect between subarrays
  default: "htree_baseline"  # htree_baseline | libcom

# Bank 1: 32KB with 8 Subarrays - LIBCom Configuration
# DAC'26 Evaluation: LIBCom direct interconnect

memory:
  type: "SRAM"  # On-chip bank
  organization:
    capacity: 32768      # 32 KB
    num_banks: 1
    num_subarrays: 8     # 8 × 4KB subarrays
    num_bank_groups: 1
    num_chips: 1

    # Subarray details
    subarray_size_bytes: 4096     # 4 KB
    words_per_subarray: 1024      # 1024 × 32-bit words
    word_size_bits: 32

  # Timing parameters
  timing:
    access_latency_cycles: 1      # Subarray access: 1 cycle
    clock_frequency_mhz: 500      # 500 MHz
    cycle_time_ns: 2              # 2 ns per cycle

  # Technology
  technology:
    node_nm: 22
    line_size: 32  # 32 bits

# Network Configuration: LIBCom (Direct interconnect)
network:
  topology: "CROSSBAR"  # Direct point-to-point via switches
  model: "GARNET"

  # LIBCom parameters
  switch_latency_cycles: 1         # 1 cycle per switch hop
  max_hops: 1                      # Direct connections

  # Virtual Networks
  virtual_networks: 2              # VN0: Read, VN1: Write
  virtual_channels_per_vn: 1

  # Router configuration
  router_pipeline: "MINIMAL"
  router_latency: 1
  enable_router_bypass: true

  # Buffer configuration
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters
  subarray_network:
    link_width_bits: 128          # Wide on-chip paths
    frequency_GHz: 0.5            # 500 MHz
    latency_cycles: 1             # Direct switch latency

# Operations Configuration
operations:
  # Traditional operations
  read:
    latency_cycles: 1
    energy_relative: 1.0

  write:
    latency_cycles: 1
    energy_relative: 1.0

  # Inter-subarray operations (via LIBCom)
  copy:
    latency_cycles: 1             # Direct transfer (1× subarray access)
    energy_relative: 0.55         # 45% energy reduction
    description: "Direct LIBCom transfer"

  move:
    latency_cycles: 1             # Direct transfer (1× subarray access)
    energy_relative: 0.53         # 47% energy reduction
    description: "Direct LIBCom transfer"

# Evaluation metrics
metrics:
  track_direct_transfers: true
  track_intersubarray_comm: true
  track_energy: true
  track_cycles: true

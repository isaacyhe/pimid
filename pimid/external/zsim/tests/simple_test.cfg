// Simple test configuration for ZSim
// Uses a minimal setup for quick testing

sys = {
    lineSize = 64;
    frequency = 2400;  // 2.4 GHz

    cores = {
        simple = {
            type = "Simple";
            cores = 1;
            icache = "l1i";
            dcache = "l1d";
        };
    };

    caches = {
        l1d = {
            caches = 1;
            size = 32768;
            latency = 4;
        };
        l1i = {
            caches = 1;
            size = 32768;
            latency = 3;
        };
    };

    mem = {
        type = "Simple";
        latency = 100;
    };
};

sim = {
    phaseLength = 1000;
    maxTotalInstrs = 10000L;  // Small number for quick test
    statsPhaseInterval = 100;
    printHierarchy = true;
    aslr = true;
};

process0 = {
    command = "/bin/echo 'Hello from ZSim!'";
};

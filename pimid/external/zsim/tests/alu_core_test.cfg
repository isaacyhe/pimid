// ALU Core Test Configuration
// Tests the new ALU-only core model with NO cache hierarchy
// Also demonstrates SIMD width configuration

sys = {
    lineSize = 64;
    frequency = 2400;  // 2.4 GHz
    simdWidth = 256;   // AVX: 2× SSE latency

    cores = {
        // ALU cores - pure computation, no memory hierarchy
        alu = {
            type = "ALU";
            cores = 4;
            aluLatency = 1;  // 1 cycle per instruction
            // NOTE: No icache/dcache parameters - ALU core has NO cache!
        };

        // Simple core for comparison (with cache)
        simple = {
            type = "Simple";
            cores = 2;
            icache = "l1i";
            dcache = "l1d";
        };
    };

    // Cache hierarchy (only for Simple cores)
    caches = {
        l1d = {
            caches = 2;  // Match number of Simple cores
            size = 32768;
            latency = 4;
        };
        l1i = {
            caches = 2;  // Match number of Simple cores
            size = 32768;
            latency = 3;
        };
        l2 = {
            caches = 1;
            size = 262144;
            latency = 12;
            children = "l1i|l1d";
        };
    };

    mem = {
        type = "Simple";
        latency = 100;
    };
};

sim = {
    phaseLength = 10000;
    maxTotalInstrs = 1000000L;
    statsPhaseInterval = 100;
    printHierarchy = true;
    aslr = true;  // Don't try to disable ASLR (for containerized environments)
};

// Test process - simple computation
process0 = {
    command = "ls -alh tests/";
};

// ZSim Configuration: ALU Cores as Bank-Level PIM Processing Elements
// ========================================================================
// This configuration demonstrates using ALU cores as PIM PEs placed at
// the bank level in DRAM. Each PE has NO cache hierarchy and accesses
// data directly through the PIM memory controller.
//
// Configuration:
// - 64 ALU cores (PEs) distributed across 16 banks = 4 PEs per bank
// - Each PE: 1-cycle ALU latency, 256-bit SIMD (AVX)
// - NO cache hierarchy - perfect for PIM!
// - Memory access through PIM controller (not modeled in ZSim directly)
// ========================================================================

sys = {
    lineSize = 64;
    frequency = 2400;      // 2.4 GHz (matches DDR4-2400)
    simdWidth = 256;       // AVX support (2× SSE latency)

    cores = {
        // 64 PIM Processing Elements at bank level
        bank_pes = {
            type = "ALU";      // ALU core - NO cache!
            cores = 64;        // 64 PEs total (4 per bank × 16 banks)
            aluLatency = 1;    // 1 cycle per ALU operation

            // NOTE: NO icache/dcache parameters!
            // ALU cores have no cache hierarchy
            // Memory access handled by PIM controller
        };
    };

    // Memory configuration (placeholder - actual DRAM via PIM controller)
    // ZSim's memory model is bypassed for PIM workloads
    mem = {
        type = "Simple";
        latency = 0;     // Latency handled by Ramulator in PIM controller
    };
};

sim = {
    phaseLength = 10000;
    maxTotalInstrs = 10000000L;  // 10 million instructions
    statsPhaseInterval = 1000;
    printHierarchy = true;
    aslr = true;  // Required for containerized environments
};

// PIM workload process
// This process will be instrumented by Pin and executed on the ALU cores
// Memory operations will be intercepted and routed to the PIM controller
process0 = {
    command = "/bin/echo 'PIM Bank-Level Test'";  // Placeholder for bank-level workload
    // Actual workload: command = "./pim_bank_workload";
};

// ========================================================================
// Integration Notes:
// ========================================================================
//
// 1. ALU Core Guarantees:
//    - LoadFunc() panics if called → ensures no cache access
//    - StoreFunc() panics if called → ensures no cache access
//    - Pure computation: cycles = instrs × aluLatency
//
// 2. PIM Controller Integration (external to ZSim):
//    - Register 64 PEs at BANK granularity
//    - Distribute across 16 banks (4 PEs per bank)
//    - Each PE accesses local bank through 8-bit port (DDR4)
//    - Bandwidth: 1.2 GB/s per bank, shared among 4 PEs = 300 MB/s each
//
// 3. Expected Performance (1 GB workload, 128 GFLOPs):
//    - Compute: ~1 ms (128 GFLOPs / 128 GFLOPS)
//    - Data movement: ~834 ms (limited by 8-bit bank serialization)
//    - Total: ~835 ms (BANDWIDTH-BOUND!)
//    - Speedup vs Host: ~0.13× (SLOWER due to DDR4 bank bottleneck)
//
// 4. For Better Performance:
//    - Use HBM2: 64-bit bank ports → 32 GB/s total → 3.3× speedup!
//    - Use Rank-level PIM: 64-bit rank interface → same as host
//    - Increase data locality: keep data in local bank
// ========================================================================

# BFS Benchmark Configuration - Auto-generated
# Placement: MC, PE: In-Order Core, Memory: SRAM
# Workload: Small (4096 vertices, degree 8)

benchmark:
  name: "BFS_MC_In-OrderCore_SRAM"
  description: "BFS with MC-level In-Order Core PE on SRAM"
  workload_type: "bfs"

# Workload parameters
workload:
  graph:
    num_vertices: 4096
    avg_degree: 8
    topology: "random"

  bfs:
    root_vertex: 0
    traversal_mode: "level_synchronous"

# Memory configuration
memory:
  technology: "SRAM"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4

  # Memory timing characteristics
  timing:
    subarray_read_ns: 2.5
    subarray_write_ns: 2.5
    inner_bank_htree_ns: 2.74

# Processing element configuration
processing_element:
  type: "in_order_core"
  placement_level: "MC"
  num_pes: 1

  # In-Order Core specifications
  pipeline:
    stages: 5
    fetch_decode_ns: 2.0
    execute_compare_ns: 1.0
    execute_alu_ns: 1.0
    memory_access_ns: 1.0
    writeback_ns: 0.5
    branch_penalty_ns: 3.0
    branch_prediction_accuracy: 0.5

  energy:
    fetch_decode_pj: 10.0
    alu_pj: 5.0
    branch_pj: 8.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/bfs_mc_inorder_sram_4k_deg8_stats.txt"
  detailed_log: "results/bfs_mc_inorder_sram_4k_deg8_detailed.log"
  summary_format: "table"

# Test metadata
metadata:
  placement_level: "mc"
  pe_type: "inorder"
  memory_tech: "sram"
  workload_size: "small"
  graph_degree: 8
  auto_generated: true

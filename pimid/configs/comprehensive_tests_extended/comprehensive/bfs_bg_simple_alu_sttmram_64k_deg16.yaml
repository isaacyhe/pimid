# BFS Benchmark Configuration - Auto-generated
# Placement: BG, PE: Simple ALU, Memory: STT_MRAM
# Workload: Large (65536 vertices, degree 16)

benchmark:
  name: "BFS_BG_SimpleALU_STT_MRAM"
  description: "BFS with BG-level Simple ALU PE on STT_MRAM"
  workload_type: "bfs"

# Workload parameters
workload:
  graph:
    num_vertices: 65536
    avg_degree: 16
    topology: "random"

  bfs:
    root_vertex: 0
    traversal_mode: "level_synchronous"

# Memory configuration
memory:
  technology: "STT_MRAM"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4

  # Memory timing characteristics
  timing:
    subarray_read_ns: 7.0
    subarray_write_ns: 25.0
    inner_bank_htree_ns: 7.3

# Processing element configuration
processing_element:
  type: "simple_alu"
  placement_level: "BG"
  num_pes: 2

  # Simple ALU specifications
  timing:
    compare_ns: 0.3
    alu_ns: 0.5
    load_ns: 0.5

  energy:
    alu_pj: 2.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/bfs_bg_simple_alu_sttmram_64k_deg16_stats.txt"
  detailed_log: "results/bfs_bg_simple_alu_sttmram_64k_deg16_detailed.log"
  summary_format: "table"

# Test metadata
metadata:
  placement_level: "bg"
  pe_type: "simple_alu"
  memory_tech: "sttmram"
  workload_size: "large"
  graph_degree: 16
  auto_generated: true

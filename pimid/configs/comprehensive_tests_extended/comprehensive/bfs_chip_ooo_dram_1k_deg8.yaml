# BFS Benchmark Configuration - Auto-generated
# Placement: CHIP, PE: Out-of-Order Core, Memory: DRAM
# Workload: Tiny (1024 vertices, degree 8)

benchmark:
  name: "BFS_CHIP_Out-of-OrderCore_DRAM"
  description: "BFS with CHIP-level Out-of-Order Core PE on DRAM"
  workload_type: "bfs"

# Workload parameters
workload:
  graph:
    num_vertices: 1024
    avg_degree: 8
    topology: "random"

  bfs:
    root_vertex: 0
    traversal_mode: "level_synchronous"

# Memory configuration
memory:
  technology: "DRAM"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4

  # Memory timing characteristics
  timing:
    subarray_read_ns: 13.32
    subarray_write_ns: 15.0
    inner_bank_htree_ns: 6.65

# Processing element configuration
processing_element:
  type: "out_of_order_core"
  placement_level: "CHIP"
  num_pes: 1

  # Out-of-Order Core specifications
  pipeline:
    stages: 7  # More stages for OOO
    fetch_decode_ns: 2.5
    execute_compare_ns: 0.8
    execute_alu_ns: 0.8
    memory_access_ns: 1.0
    writeback_ns: 0.5
    branch_penalty_ns: 2.0
    branch_prediction_accuracy: 0.85  # Better prediction

  ooo_config:
    reorder_buffer_size: 128
    issue_width: 4
    retire_width: 4
    load_queue_size: 64
    store_queue_size: 32

  energy:
    fetch_decode_pj: 15.0  # Higher due to complexity
    alu_pj: 6.0
    branch_pj: 10.0
    rob_pj: 8.0  # Reorder buffer energy

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/bfs_chip_ooo_dram_1k_deg8_stats.txt"
  detailed_log: "results/bfs_chip_ooo_dram_1k_deg8_detailed.log"
  summary_format: "table"

# Test metadata
metadata:
  placement_level: "chip"
  pe_type: "ooo"
  memory_tech: "dram"
  workload_size: "tiny"
  graph_degree: 8
  auto_generated: true

# PCM (Phase-Change Memory) Configuration
# Default configuration for PCM-based PIM benchmarks

memory:
  technology: "PCM"
  model: "NVSim"

  # PCM organization
  capacity: 268435456  # 256 MB
  num_banks: 8
  num_subarrays_per_bank: 16
  num_bank_groups: 2
  num_chips: 1

  # Technology parameters
  technology:
    node_nm: 22  # 22nm technology
    cell_type: "PCM"
    line_size: 64

  # Timing parameters (in nanoseconds)
  timing:
    read_latency: 20   # Moderate read latency
    write_latency: 150  # Much slower writes (phase change)
    access_time: 20
    cycle_time: 4.0    # 250 MHz

  # Bandwidth
  bus_width_bits: 64
  frequency_ghz: 1.2

  # Energy per access (in pJ)
  energy:
    read_energy_pj: 400   # Moderate read energy
    write_energy_pj: 8000  # Very high write energy (heating)
    leakage_power_mw: 5   # Low leakage

  # Endurance
  endurance:
    max_write_cycles: 100000000  # ~10^8 cycles (limited endurance)

# NVSim-specific configuration
nvsim:
  enable_power_modeling: true
  cell_type: "PCRAM"
  access_mode: "CMOS"

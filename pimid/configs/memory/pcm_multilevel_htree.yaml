# PCM with GARNET H-tree Internal Network Configuration
# Memory Technology: PCM (Multi-Level Cell - MLC)
# Topology: H-tree (hierarchical tree for bank interconnect)
# Key Feature: Higher density but slower than SLC

memory:
  type: "PCM"
  organization:
    capacity: 1073741824  # 1 GB (MLC for higher density)
    num_banks: 16
    num_subarrays: 32
    num_bank_groups: 4
    num_chips: 1

  # Timing parameters (ns) - Slower due to MLC
  timing:
    read_latency: 35.0   # Slower read (multi-level sensing)
    write_latency: 250.0 # Much slower write (precise phase control)
    cycle_time: 1.0      # 1.0 GHz

  # Technology
  technology:
    node_nm: 32
    endurance: 1e7       # Lower endurance for MLC
    retention_years: 10
    levels_per_cell: 4   # MLC

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks - Essential for MLC PCM
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  virtual_channels_per_vn: 1

  # Router Pipeline - MINIMAL
  router_pipeline: "MINIMAL"
  router_latency: 1
  enable_router_bypass: true

  # Buffer depths
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters
  subarray_network:
    link_width_bits: 64
    frequency_GHz: 1.0
    latency_cycles: 5

  bank_network:
    link_width_bits: 16
    frequency_GHz: 1.0
    latency_cycles: 10

  bank_group_network:
    link_width_bits: 32
    frequency_GHz: 1.0
    latency_cycles: 20

  chip_network:
    link_width_bits: 16
    frequency_GHz: 1.0
    latency_cycles: 40

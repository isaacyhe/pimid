# STT-MRAM Memory Configuration
# Default configuration for STT-MRAM-based PIM benchmarks

memory:
  technology: "STT-MRAM"
  model: "NVSim"

  # STT-MRAM organization
  capacity: 134217728  # 128 MB
  num_banks: 8
  num_subarrays_per_bank: 16
  num_bank_groups: 2
  num_chips: 1

  # Technology parameters
  technology:
    node_nm: 22  # 22nm technology
    cell_type: "STT-MRAM"
    line_size: 64

  # Timing parameters (in nanoseconds)
  timing:
    read_latency: 10   # Faster reads
    write_latency: 50  # Slower writes (write asymmetry)
    access_time: 10
    cycle_time: 2.0    # 500 MHz

  # Bandwidth
  bus_width_bits: 64
  frequency_ghz: 1.5

  # Energy per access (in pJ)
  energy:
    read_energy_pj: 300   # Low energy reads
    write_energy_pj: 5000  # High energy writes (STT switching)
    leakage_power_mw: 10  # Very low leakage

  # Endurance
  endurance:
    max_write_cycles: 1000000000000000  # ~10^15 cycles

# NVSim-specific configuration
nvsim:
  enable_power_modeling: true
  cell_type: "MRAM"
  access_mode: "CMOS"

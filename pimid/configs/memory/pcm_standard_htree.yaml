# PCM with GARNET H-tree Internal Network Configuration
# Memory Technology: PCM (Phase Change Memory - Standard)
# Topology: H-tree (hierarchical tree for bank interconnect)
# Key Feature: Very high write latency (crystallization/amorphization)

memory:
  type: "PCM"
  organization:
    capacity: 268435456  # 256 MB
    num_banks: 8
    num_subarrays: 16
    num_bank_groups: 2
    num_chips: 1

  # Timing parameters (ns)
  timing:
    read_latency: 20.0   # Moderate read (sensing resistance)
    write_latency: 150.0 # Very slow write (phase change)
    cycle_time: 0.83     # 1.2 GHz

  # Technology
  technology:
    node_nm: 45
    endurance: 1e8       # Limited endurance
    retention_years: 10

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks - VERY important for PCM!
  # Massive asymmetry: write >> read
  virtual_networks: 2  # VN0: Reads, VN1: Writes (very slow)

  virtual_channels_per_vn: 1

  # Router Pipeline - MINIMAL
  router_pipeline: "MINIMAL"
  router_latency: 1
  enable_router_bypass: true

  # Buffer depths
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Moderate for NVM
  subarray_network:
    link_width_bits: 64
    frequency_GHz: 1.2
    latency_cycles: 4

  bank_network:
    link_width_bits: 16
    frequency_GHz: 1.2
    latency_cycles: 8

  bank_group_network:
    link_width_bits: 32
    frequency_GHz: 1.2
    latency_cycles: 16

  chip_network:
    link_width_bits: 16
    frequency_GHz: 1.2
    latency_cycles: 32

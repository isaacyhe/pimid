# BFS Benchmark Configuration - Auto-generated
# Placement: SUBARRAY, PE: Simple ALU, Memory: SRAM
# Workload: Small (4096 vertices, degree 16)

benchmark:
  name: "BFS_SUBARRAY_SimpleALU_SRAM"
  description: "BFS with SUBARRAY-level Simple ALU PE on SRAM"
  workload_type: "bfs"

# Workload parameters
workload:
  graph:
    num_vertices: 4096
    avg_degree: 16
    topology: "random"

  bfs:
    root_vertex: 0
    traversal_mode: "level_synchronous"

# Memory configuration
memory:
  technology: "SRAM"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4

  # Memory timing characteristics
  timing:
    subarray_read_ns: 2.5
    subarray_write_ns: 2.5
    inner_bank_htree_ns: 2.74

# Processing element configuration
processing_element:
  type: "simple_alu"
  placement_level: "SUBARRAY"
  num_pes: 16

  # Simple ALU specifications
  timing:
    compare_ns: 0.3
    alu_ns: 0.5
    load_ns: 0.5

  energy:
    alu_pj: 2.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/bfs_subarray_simple_alu_sram_4k_deg16_stats.txt"
  detailed_log: "results/bfs_subarray_simple_alu_sram_4k_deg16_detailed.log"
  summary_format: "table"

# Test metadata
metadata:
  placement_level: "subarray"
  pe_type: "simple_alu"
  memory_tech: "sram"
  workload_size: "small"
  graph_degree: 16
  auto_generated: true

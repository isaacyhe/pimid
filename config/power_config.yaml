# PIMID Power Modeling Configuration
# Configuration for system-wide power and energy estimation

#==============================================================================
# POWER MODELING SETTINGS
#==============================================================================
power_modeling:
  # Enable power modeling
  enabled: true

  # Power model: McPAT, CACTI, custom
  model: "McPAT"

  # Granularity: component, system
  granularity: "component"

  # Update interval (cycles)
  update_interval: 10000

#==============================================================================
# TECHNOLOGY PARAMETERS
#==============================================================================
technology:
  # Technology node (nm)
  tech_node_nm: 22

  # Device type: HP (high-performance), LSTP (low-standby-power), LOP (low-operating-power)
  device_type: "HP"

  # Temperature (Kelvin)
  temperature_k: 350

  # Operating voltage (V)
  voltage: 1.0

  # Clock frequency (GHz)
  frequency_ghz: 2.0

#==============================================================================
# HOST PROCESSOR POWER
#==============================================================================
host:
  # Enable host power modeling
  enabled: true

  # Core power parameters
  core:
    # Number of cores
    num_cores: 4

    # Dynamic power per core (W)
    dynamic_power_w: 5.0

    # Leakage power per core (W)
    leakage_power_w: 0.5

    # Power scaling with utilization
    scale_with_utilization: true

    # Power states
    power_states:
      active: 1.0
      idle: 0.3
      sleep: 0.05

  # Cache power parameters
  cache:
    # L1 cache (per core)
    l1:
      dynamic_power_per_access_nj: 0.1
      leakage_power_w: 0.05

    # L2 cache (per core)
    l2:
      dynamic_power_per_access_nj: 0.5
      leakage_power_w: 0.1

    # L3 cache (shared)
    l3:
      dynamic_power_per_access_nj: 2.0
      leakage_power_w: 1.0

  # Memory controller power
  memory_controller:
    dynamic_power_w: 2.0
    leakage_power_w: 0.2

#==============================================================================
# DEVICE (PE) POWER
#==============================================================================
device:
  # Enable device power modeling
  enabled: true

  # PE power parameters
  pe:
    # Dynamic power per PE (W)
    dynamic_power_w: 1.0

    # Leakage power per PE (W)
    leakage_power_w: 0.1

    # Power scaling
    scale_with_utilization: true

    # PE power states
    power_states:
      active: 1.0
      idle: 0.2
      power_down: 0.01

  # PE local memory/cache power
  pe_memory:
    # Scratchpad power
    scratchpad:
      dynamic_power_per_access_nj: 0.05
      leakage_power_w: 0.02

    # PE L1 cache
    l1:
      dynamic_power_per_access_nj: 0.08
      leakage_power_w: 0.03

#==============================================================================
# MEMORY SYSTEM POWER
#==============================================================================
memory:
  # Enable memory power modeling
  enabled: true

  # DRAM power (if using DRAM)
  dram:
    # Background power (W per rank)
    background_power_w: 1.5

    # Activate power (nJ per activation)
    activate_energy_nj: 5.0

    # Read power (nJ per read)
    read_energy_nj: 2.5

    # Write power (nJ per write)
    write_energy_nj: 3.0

    # Refresh power (W per rank)
    refresh_power_w: 0.5

    # Termination power (W)
    termination_power_w: 0.3

  # SRAM power (if using SRAM)
  sram:
    # Dynamic power per access (nJ)
    dynamic_power_per_access_nj: 0.05

    # Leakage power per MB (W)
    leakage_power_per_mb_w: 0.01

  # STT-MRAM power (if using STT-MRAM)
  stt_mram:
    # Read power (nJ per read)
    read_energy_nj: 0.5

    # Write power (nJ per write)
    write_energy_nj: 2.5

    # Leakage power per MB (W)
    leakage_power_per_mb_w: 0.001  # Very low leakage

#==============================================================================
# NETWORK-ON-CHIP POWER
#==============================================================================
network:
  # Enable network power modeling
  enabled: true

  # Router power
  router:
    # Dynamic power per flit (nJ)
    dynamic_power_per_flit_nj: 0.5

    # Leakage power per router (W)
    leakage_power_w: 0.1

    # Buffer power (per flit stored)
    buffer_power_per_flit_cycle_nj: 0.01

  # Link power
  link:
    # Dynamic power per bit transmitted (pJ/bit)
    dynamic_power_per_bit_pj: 0.1

    # Leakage power per link (W)
    leakage_power_w: 0.01

    # Link length for power calculation (mm)
    length_mm: 5.0

#==============================================================================
# McPAT INTEGRATION
#==============================================================================
mcpat:
  # McPAT executable path
  executable: "pimid/external/mcpat/mcpat"

  # McPAT configuration template
  template_file: "pimid/external/mcpat/template.xml"

  # Output file
  output_file: "mcpat_output.xml"

  # Components to model
  components:
    - "core"
    - "l1_cache"
    - "l2_cache"
    - "l3_cache"
    - "memory_controller"

  # McPAT options
  options:
    optimization: "ED"  # ED, ED2, EDP
    wire_type: "global"  # global, semi-global, local

#==============================================================================
# POWER MANAGEMENT
#==============================================================================
power_management:
  # Dynamic Voltage and Frequency Scaling (DVFS)
  dvfs:
    enabled: false

    # DVFS domains: per_core, per_cluster, global
    domain: "per_core"

    # Voltage-frequency pairs
    vf_pairs:
      - voltage: 0.8
        frequency_ghz: 1.0
      - voltage: 0.9
        frequency_ghz: 1.5
      - voltage: 1.0
        frequency_ghz: 2.0
      - voltage: 1.1
        frequency_ghz: 2.5

    # DVFS transition latency (cycles)
    transition_latency: 1000

    # DVFS policy: performance, balanced, power_save
    policy: "balanced"

  # Power gating
  power_gating:
    enabled: false

    # Gating granularity: core, cluster, system
    granularity: "core"

    # Power-on latency (cycles)
    power_on_latency: 10000

    # Power-off latency (cycles)
    power_off_latency: 100

    # Threshold for power gating (idle cycles)
    threshold_cycles: 100000

  # Clock gating
  clock_gating:
    enabled: true

    # Gating granularity: functional_unit, module, global
    granularity: "module"

    # Power savings factor (0.0-1.0)
    savings_factor: 0.3

#==============================================================================
# THERMAL MODELING
#==============================================================================
thermal:
  # Enable thermal modeling
  enabled: false

  # Thermal model: HotSpot, 3D-ICE, simple
  model: "HotSpot"

  # Ambient temperature (C)
  ambient_temp_c: 25

  # Thermal design power (TDP) in Watts
  tdp_w: 100

  # Cooling solution: air, liquid, passive
  cooling: "air"

  # Thermal throttling
  throttling:
    enabled: false
    threshold_temp_c: 85
    throttle_factor: 0.5

  # HotSpot configuration
  hotspot:
    config_file: "hotspot_config.txt"
    floorplan_file: "floorplan.flp"

#==============================================================================
# ENERGY ACCOUNTING
#==============================================================================
energy_accounting:
  # Detailed energy breakdown
  detailed_breakdown: true

  # Energy domains to track
  domains:
    - "core"
    - "cache"
    - "memory"
    - "network"
    - "io"
    - "other"

  # Track per-component energy
  per_component_tracking: true

  # Track per-operation energy
  per_operation_tracking: false  # Can be very detailed

#==============================================================================
# BATTERY MODELING (for mobile/embedded)
#==============================================================================
battery:
  # Enable battery modeling
  enabled: false

  # Battery capacity (mAh)
  capacity_mah: 3000

  # Battery voltage (V)
  voltage: 3.7

  # Battery chemistry: Li-ion, Li-polymer, NiMH
  chemistry: "Li-ion"

  # Discharge curve modeling
  discharge_model: "linear"  # Options: linear, non-linear, lookup_table

  # Track battery lifetime
  track_lifetime: true

#==============================================================================
# POWER STATISTICS
#==============================================================================
statistics:
  # Detailed power statistics
  detailed_stats: true

  # Statistics output file
  stats_file: "power_stats.txt"

  # Per-component statistics
  per_component_stats: true

  # Power trace generation
  power_trace:
    enabled: false
    output_file: "power_trace.txt"
    interval_cycles: 1000

  # Energy histogram
  energy_histogram:
    enabled: true
    min_energy: 0
    max_energy: 100
    bucket_size: 1

#==============================================================================
# VALIDATION AND CALIBRATION
#==============================================================================
validation:
  # Enable power model validation
  enabled: false

  # Reference measurements file
  reference_file: "power_measurements.txt"

  # Calibration factors
  calibration:
    core_factor: 1.0
    cache_factor: 1.0
    memory_factor: 1.0
    network_factor: 1.0

  # Error reporting
  report_errors: true
  error_threshold: 0.1  # 10% error threshold

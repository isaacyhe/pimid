# PIMID Host Engine Configuration
# Configuration for the conventional processor (host)

#==============================================================================
# HOST CORES
#==============================================================================
cores:
  # Number of cores
  num_cores: 4

  # Core configuration (can specify per-core or use default)
  default:
    # Core type: in-order, out-of-order
    type: "out-of-order"

    # Operating frequency (MHz)
    frequency_mhz: 3000

    # Number of hardware threads per core
    num_threads: 2

    # Pipeline configuration
    pipeline_depth: 14
    issue_width: 4
    retire_width: 4

    # Execution units
    num_int_alu: 4
    num_fp_alu: 2
    num_load_units: 2
    num_store_units: 1
    num_branch_units: 1

    # ROB and reservation stations
    rob_size: 128
    int_reservation_stations: 32
    fp_reservation_stations: 16
    load_store_queue_size: 32

    # Branch prediction
    branch_predictor: "tournament"  # Options: bimodal, gshare, tournament, tage
    btb_entries: 4096
    ras_size: 16

#==============================================================================
# CACHE HIERARCHY
#==============================================================================
caches:
  # L1 Instruction Cache
  l1i:
    size_kb: 32
    line_size_bytes: 64
    associativity: 8
    latency_cycles: 4
    replacement_policy: "LRU"  # Options: LRU, PLRU, Random, NMRU
    write_policy: "write-back"
    prefetcher: "none"  # Options: none, stream, stride

  # L1 Data Cache
  l1d:
    size_kb: 32
    line_size_bytes: 64
    associativity: 8
    latency_cycles: 4
    replacement_policy: "LRU"
    write_policy: "write-back"
    prefetcher: "stream"
    mshr_entries: 16

  # L2 Cache (private per core)
  l2:
    size_kb: 256
    line_size_bytes: 64
    associativity: 8
    latency_cycles: 12
    replacement_policy: "LRU"
    write_policy: "write-back"
    prefetcher: "stride"
    mshr_entries: 32

  # L3 Cache (shared across all cores)
  l3:
    size_kb: 8192
    line_size_bytes: 64
    associativity: 16
    latency_cycles: 30
    replacement_policy: "LRU"
    write_policy: "write-back"
    prefetcher: "none"
    mshr_entries: 64
    num_banks: 16

#==============================================================================
# CACHE COHERENCE
#==============================================================================
coherence:
  # Protocol: MSI, MESI, MOESI, MESIF
  protocol: "MESI"

  # Directory-based or snooping
  type: "directory"  # Options: directory, snooping

  # Directory configuration (if directory-based)
  directory_entries: 16384
  directory_associativity: 4

#==============================================================================
# MEMORY CONTROLLER
#==============================================================================
memory_controller:
  # Number of memory controllers
  num_controllers: 2

  # Queue sizes
  read_queue_size: 32
  write_queue_size: 32

  # Scheduling policy: FCFS, FR-FCFS, PAR-BS
  scheduling_policy: "FR-FCFS"

  # Write batching
  write_batching: true
  write_batch_size: 8

  # Memory request reordering
  reordering_enabled: true

#==============================================================================
# INTERCONNECT
#==============================================================================
interconnect:
  # Host-side interconnect: bus, crossbar, ring, mesh
  type: "crossbar"

  # Bandwidth (GB/s)
  bandwidth_gbs: 64

  # Latency (cycles)
  latency_cycles: 10

#==============================================================================
# ZSIM INTEGRATION
#==============================================================================
zsim:
  # ZSim configuration file (if using ZSim for host)
  config_file: "config/zsim_host.cfg"

  # Enable ZSim
  enabled: true

  # ZSim binary path
  binary_path: "pimid/external/zsim/build/opt/zsim"

  # Pin tool options
  pin_options: "-ifeellucky"

#==============================================================================
# PERFORMANCE COUNTERS
#==============================================================================
performance_counters:
  # Enable performance counter collection
  enabled: true

  # Counters to track
  track_ipc: true
  track_cache_misses: true
  track_branch_mispredictions: true
  track_memory_bandwidth: true
  track_power: true

#==============================================================================
# WORKLOAD
#==============================================================================
workload:
  # Binary to execute
  binary: ""

  # Command-line arguments
  arguments: []

  # Environment variables
  environment: {}

  # Standard input/output
  stdin: "/dev/null"
  stdout: "/dev/stdout"
  stderr: "/dev/stderr"

  # ROI markers
  use_roi_markers: true
  roi_begin_symbol: "pimid_roi_begin"
  roi_end_symbol: "pimid_roi_end"

#==============================================================================
# OFFLOAD CONFIGURATION
#==============================================================================
offload:
  # Enable PIM offloading
  enabled: true

  # Offload detection: explicit (API calls) or implicit (compiler hints)
  detection: "explicit"  # Options: explicit, implicit, auto

  # Offload symbols to detect
  offload_begin_symbol: "pimid_offload_begin"
  offload_end_symbol: "pimid_offload_end"

  # Data transfer settings
  transfer_bandwidth_gbs: 25.6  # Host to device bandwidth
  transfer_latency_cycles: 100

  # Offload threshold (minimum instructions to offload)
  min_instructions: 1000

  # Offload overhead (cycles)
  offload_overhead_cycles: 1000
  completion_overhead_cycles: 500

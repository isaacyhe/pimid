// OpenMP workload for comparison

sys = {
    cores = {
        simple = {
            type = "Simple";
            cores = 4;
            icache = "l1i";
            dcache = "l1d";
        };
    };

    lineSize = 64;

    caches = {
        l1d = { caches = 4; size = 32768; };
        l1i = { caches = 4; size = 32768; };
        l2 = { caches = 1; size = 1048576; children = "l1d|l1i"; };
    };
};

sim = {
    phaseLength = 10000;
    maxTotalInstrs = 500000000;
    schedQuantum = 100;
    aslr = false;
};

process0 = { command = "/bin/sleep 0.01"; };
process1 = { command = "/tmp/run_omp_compute.sh"; };

// ZSim Configuration: Multi-Granularity PIM PE Comparison
// ========================================================================
// This configuration runs multiple core groups at different PIM
// granularities to compare performance characteristics.
//
// Core Groups:
// 1. Rank-level PEs: 16 cores (coarse, high BW per PE)
// 2. Bank-level PEs: 64 cores (medium, shared BW)
// 3. Subarray-level PEs: 256 cores (fine, highest locality)
//
// Use this to understand PIM granularity trade-offs!
// ========================================================================

sys = {
    lineSize = 64;
    frequency = 2400;
    simdWidth = 256;  // AVX (256-bit)

    cores = {
        // Group 1: Rank-level PIM (16 PEs)
        // - 64-bit rank interface → 9.6 GB/s total
        // - Per-PE bandwidth: 600 MB/s (9.6 GB/s / 16)
        // - Large local capacity: ~1 GB per PE
        rank_pes = {
            type = "ALU";
            cores = 16;
            aluLatency = 1;
        };

        // Group 2: Bank-level PIM (64 PEs)
        // - 8-bit bank serialization → 1.2 GB/s per bank
        // - 4 PEs per bank → 300 MB/s per PE
        // - Medium local capacity: ~512 MB per bank
        bank_pes = {
            type = "ALU";
            cores = 64;
            aluLatency = 1;
        };

        // Group 3: Subarray-level PIM (256 PEs)
        // - 256-bit GSA → 38.4 GB/s internal (if local!)
        // - But serialized out through bank (1.2 GB/s shared)
        // - Small local capacity: ~32 MB per subarray
        subarray_pes = {
            type = "ALU";
            cores = 256;
            aluLatency = 1;
        };

        // Group 4: Traditional OOO core (for comparison)
        // - Full cache hierarchy
        // - Limited by rank bandwidth (9.6 GB/s)
        host_cores = {
            type = "OOO";
            cores = 4;
            icache = "l1i";
            dcache = "l1d";
        };
    };

    // Cache hierarchy (only for host_cores)
    caches = {
        l1d = {
            caches = 4;
            size = 32768;
            latency = 4;
        };
        l1i = {
            caches = 4;
            size = 32768;
            latency = 3;
        };
        l2 = {
            caches = 4;
            size = 262144;
            latency = 12;
        };
        l3 = {
            caches = 1;
            size = 8388608;  // 8 MB
            latency = 30;
            children = "l2";
        };
    };

    mem = {
        type = "Simple";
        latency = 100;  // 100 cycles (for host_cores)
    };
};

sim = {
    phaseLength = 10000;
    maxTotalInstrs = 100000000L;
    statsPhaseInterval = 10000;
    printHierarchy = true;
    aslr = true;  // Required for containerized environments
};

// Workload: Run on all core groups for comparison
process0 = {
    command = "/bin/echo 'PIM Multi-Granularity Comparison Test'";  // Placeholder
    // Actual workload: command = "./pim_comparison_workload";
};

// ========================================================================
// Expected Performance Comparison (1 GB data, 1 FLOP/byte):
// ========================================================================
//
// Configuration      | Bandwidth    | Compute     | Data Mvmt   | Total
// -------------------|--------------|-------------|-------------|--------
// Host (OOO)         | 9.6 GB/s     | ~1 ms       | ~104 ms     | ~105 ms
// Rank PIM (16 PEs)  | 9.6 GB/s     | ~1 ms       | ~104 ms     | ~105 ms
// Bank PIM (64 PEs)  | 4.8 GB/s*    | ~1 ms       | ~834 ms**   | ~835 ms
// Subarray PIM (256) | Varies***    | ~1 ms       | Depends     | Varies
//
// * 16 banks × 1.2 GB/s / 4 PEs = 4.8 GB/s total effective
// ** SEVERELY BANDWIDTH-LIMITED by 8-bit bank serialization!
// *** Depends on data locality and internal network usage
//
// Key Insights:
// 1. Rank-PIM = Host (same bandwidth, no advantage for this workload)
// 2. Bank-PIM (DDR4) is 7.9× SLOWER than Host (8-bit bottleneck!)
// 3. Subarray-PIM is BEST if data fits locally (38.4 GB/s internal)
// 4. For Bank-PIM viability: Use HBM2 (64-bit bank ports)!
//
// HBM2 Bank-PIM Performance (projected):
// - Bank bandwidth: 8 GB/s (64-bit port)
// - Total effective: 32 GB/s
// - Data movement: ~31 ms
// - Total: ~32 ms → 3.3× FASTER than Host!
// ========================================================================

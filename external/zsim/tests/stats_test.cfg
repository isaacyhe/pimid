// ZSim test to collect actual statistics
// Runs a computation to generate meaningful metrics

sys = {
    lineSize = 64;
    frequency = 2400;

    cores = {
        simple = {
            type = "Simple";
            cores = 1;
            icache = "l1i";
            dcache = "l1d";
        };
    };

    caches = {
        l1d = {
            caches = 1;
            size = 32768;
            latency = 4;
        };
        l1i = {
            caches = 1;
            size = 32768;
            latency = 3;
        };
    };

    mem = {
        type = "Simple";
        latency = 100;
    };
};

sim = {
    phaseLength = 1000;
    maxTotalInstrs = 1000000L;
    statsPhaseInterval = 100;
    printHierarchy = true;
    aslr = true;
    outputDir = "/tmp/zsim_stats";
};

process0 = {
    command = "/usr/bin/seq 1 10000";
};

// Example configuration demonstrating SIMD width parameter
// Tests different SIMD vector widths: 128-bit (SSE), 256-bit (AVX), 512-bit (AVX-512)

sys = {
    // SIMD width configuration (128, 256, or 512 bits)
    // 128-bit: SSE baseline (1× latency)
    // 256-bit: AVX (2× latency)
    // 512-bit: AVX-512 (4× latency)
    simdWidth = 256;  // AVX: 2× SSE latency

    frequency = 2400;  // MHz
    lineSize = 64;

    cores = {
        simple = {
            type = "Simple";
            cores = 2;
            icache = "l1i";
            dcache = "l1d";
        };

        ooo = {
            type = "OOO";
            cores = 2;
            icache = "l1i_ooo";
            dcache = "l1d_ooo";
        };
    };

    caches = {
        l1i = {
            caches = 2;
            size = 32768;
            latency = 3;
        };
        l1d = {
            caches = 2;
            size = 32768;
            latency = 4;
        };
        l1i_ooo = {
            caches = 2;
            size = 32768;
            latency = 3;
        };
        l1d_ooo = {
            caches = 2;
            size = 32768;
            latency = 4;
        };
        l2 = {
            caches = 1;
            size = 2097152;
            latency = 10;
            children = "l1i|l1d|l1i_ooo|l1d_ooo";
        };
    };
};

sim = {
    phaseLength = 10000;
    schedQuantum = 50;
};

// Test process with SIMD-heavy workload
process0 = {
    command = "ls -alh tests/";
};

// ZSim Configuration: ALU Cores as Subarray-Level PIM Processing Elements
// ========================================================================
// This configuration demonstrates using ALU cores as PIM PEs placed at
// the finest granularity - the subarray level. This provides maximum
// locality but requires internal network for cross-subarray communication.
//
// Configuration:
// - 256 ALU cores (PEs): 1 PE per subarray (16 subarrays/bank × 16 banks)
// - Each PE: 1-cycle ALU latency, 512-bit SIMD (AVX-512)
// - NO cache hierarchy
// - Highest local bandwidth (256-bit GSA = 38.4 GB/s internal)
// - Smallest local capacity (~32 MB per subarray)
// ========================================================================

sys = {
    lineSize = 64;
    frequency = 2400;      // 2.4 GHz (matches DDR4-2400)
    simdWidth = 512;       // AVX-512 support (4× SSE latency)

    cores = {
        // 256 PIM Processing Elements at subarray level
        subarray_pes = {
            type = "ALU";      // ALU core - NO cache!
            cores = 256;       // 1 PE per subarray
            aluLatency = 1;    // 1 cycle per ALU operation

            // NO icache/dcache - memory via PIM controller
        };
    };

    mem = {
        type = "Simple";
        latency = 0;     // Handled by PIM controller
    };
};

sim = {
    phaseLength = 10000;
    maxTotalInstrs = 50000000L;  // 50 million instructions
    statsPhaseInterval = 5000;
    printHierarchy = true;
    aslr = true;  // Required for containerized environments
};

// Subarray-level PIM workload
// Best for: Small, data-local computations that fit in ~32 MB
process0 = {
    command = "/bin/echo 'PIM Subarray-Level Test'";  // Placeholder
    // Actual workload: command = "./pim_subarray_workload";
};

// ========================================================================
// Subarray-Level PIM Characteristics:
// ========================================================================
//
// 1. Advantages:
//    - Finest granularity → maximum parallelism (256 PEs)
//    - Highest local bandwidth (256-bit GSA @ 1.2 GHz = 38.4 GB/s)
//    - Perfect for data-local workloads
//
// 2. Challenges:
//    - Smallest local capacity (~32 MB per subarray)
//    - Requires internal network for cross-subarray communication
//    - Network latency can be significant (50+ cycles in DDR4)
//    - Data must fit in subarray or face network overhead
//
// 3. Best Use Cases:
//    - Matrix multiplication on tiles (32 MB fits in subarray)
//    - Image processing on blocks
//    - Graph analytics on partitions
//    - Any algorithm with strong data locality
//
// 4. Performance Expectations:
//    If data fits locally (≤32 MB):
//      - Excellent: Full 38.4 GB/s local bandwidth
//      - Minimal latency: Direct GSA access
//
//    If data requires network (>32 MB):
//      - Network latency: 50+ cycles per transfer (DDR4)
//      - Reduced bandwidth: Limited by internal paths
//      - Better with HBM2: Lower network latency via TSV
// ========================================================================

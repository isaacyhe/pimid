// MPI workload template for ZSim
// Usage: zsim_mpi_run.sh -np 4 -cfg configs/mpi_template.cfg -- /path/to/mpi_binary
//
// This config is used as a TEMPLATE - the actual config is generated per-rank
// by zsim_mpi_run.sh with appropriate process commands

sys = {
    cores = {
        simple = {
            type = "Simple";
            cores = 1;  // One core per rank (each rank runs in separate ZSim)
            icache = "l1i";
            dcache = "l1d";
        };
    };

    lineSize = 64;

    caches = {
        l1d = { caches = 1; size = 32768; };   // 32KB L1D
        l1i = { caches = 1; size = 32768; };   // 32KB L1I
        l2 = { caches = 1; size = 1048576; children = "l1d|l1i"; };  // 1MB L2
    };
};

sim = {
    phaseLength = 10000;
    maxTotalInstrs = 500000000;
    schedQuantum = 100;
};

// process0.command is set by zsim_mpi_run.sh
// process0 = { command = "<MPI_BINARY>"; };

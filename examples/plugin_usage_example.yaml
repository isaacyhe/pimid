# ============================================================================
# PIMID Plugin System - Complete Usage Example
# ============================================================================
# This configuration demonstrates how to use all 4 main plugin types:
#   1. Core Types (PE_TYPE) - Processing Element architectures
#   2. Schedulers - Task scheduling algorithms
#   3. Memory Models - Memory technology plugins
#   4. Network Models - Network-on-chip topologies
#
# Copy this file to config/pimid_config.yaml and modify as needed.
# ============================================================================

# ----------------------------------------------------------------------------
# Plugin System Configuration
# ----------------------------------------------------------------------------
plugins:
  # Directory where plugins are located
  plugin_dir: "plugins/"

  # Automatically discover and load plugins from plugin_dir
  auto_discover: true

  # Explicitly loaded plugins with configuration
  loaded_plugins:
    # -------------------------------------------------------------------------
    # 1. CORE MODELS (PE_TYPE) - Processing Element Plugins
    # -------------------------------------------------------------------------

    # Example 1: Simple Scalar PE
    - name: "ScalarPE"
      # library: "plugins/libscalar_pe.so"  # Uncomment if loading as dynamic library
      config:
        num_registers: 32
        register_width_bits: 64
        pipeline_stages: 5
        frequency_mhz: 1000
        area_mm2: 0.5
        power_mw: 50

    # Example 2: Vector PE (SIMD)
    - name: "VectorPE"
      # library: "plugins/libvector_pe.so"
      config:
        num_registers: 32
        register_width_bits: 512
        vector_width: 8           # 8-way SIMD
        pipeline_stages: 6
        frequency_mhz: 1500
        area_mm2: 2.0
        power_mw: 150

    # Example 3: Matrix PE (Tensor Accelerator)
    - name: "MatrixPE"
      # library: "plugins/libmatrix_pe.so"
      config:
        num_registers: 64
        register_width_bits: 256
        matrix_size: 16           # 16x16 matrix operations
        pipeline_stages: 8
        frequency_mhz: 1000
        area_mm2: 5.0
        power_mw: 300

    # -------------------------------------------------------------------------
    # 2. SCHEDULERS - Task Scheduling Plugins
    # -------------------------------------------------------------------------

    # Example 1: Data Locality Scheduler
    - name: "DataLocalityScheduler"
      config:
        cache_line_size: 64
        consider_bank_conflicts: true

    # Example 2: Energy-Aware Scheduler
    - name: "EnergyAwareScheduler"
      config:
        energy_weight: 0.6
        performance_weight: 0.4
        prefer_nearby_pes: true

    # Example 3: Custom Scheduler
    - name: "CustomScheduler"
      config:
        locality_weight: 0.7
        load_weight: 0.3
        policy: "DATA_AWARE"

    # -------------------------------------------------------------------------
    # 3. MEMORY MODELS - Memory Technology Plugins
    # -------------------------------------------------------------------------

    # Example: Custom Memory Model (e.g., HBM2)
    - name: "HBM2"
      library: "plugins/libhbm2_model.so"
      config:
        read_latency: 40          # cycles
        write_latency: 80         # cycles
        bandwidth: 819200         # MB/s (800 GB/s)
        tech_name: "HBM2"
        tech_node_nm: 14

    # Example: Custom Emerging NVM
    - name: "CustomNVM"
      library: "plugins/libcustom_nvm.so"
      config:
        read_latency: 30
        write_latency: 200
        bandwidth: 51200
        tech_name: "STT-MRAM"
        tech_node_nm: 22

# ----------------------------------------------------------------------------
# Simulation Configuration Using Plugins
# ----------------------------------------------------------------------------

# PIM Configuration
pim:
  # SELECT WHICH PE TYPE TO USE (from PE plugins above)
  pe_type: "VectorPE"           # Options: ScalarPE, VectorPE, MatrixPE

  # SELECT WHICH SCHEDULER TO USE (from scheduler plugins above)
  scheduler: "DataLocalityScheduler"  # Options: DataLocalityScheduler,
                                      #          EnergyAwareScheduler,
                                      #          CustomScheduler

  # Number of PEs per level
  num_pes_per_bank: 4
  num_pes_per_bankgroup: 16
  num_pes_per_rank: 64

# Memory Configuration
memory:
  # SELECT WHICH MEMORY MODEL TO USE (from memory plugins above)
  technology: "HBM2"            # Options: HBM2, CustomNVM, DRAM, SRAM, etc.

  # Memory hierarchy
  num_ranks: 4
  num_bankgroups: 4
  num_banks_per_bg: 4
  num_rows: 32768
  num_cols: 1024

# ----------------------------------------------------------------------------
# 4. NETWORK MODELS - Network Topology Configuration
# ----------------------------------------------------------------------------
network:
  # SELECT TOPOLOGY
  topology: MESH_2D             # Options: MESH_2D, MESH_3D, TORUS_2D, TORUS_3D,
                                #          FAT_TREE, DRAGONFLY, H_TREE, CROSSBAR

  # SELECT ROUTING ALGORITHM
  routing: XY                   # Options: XY, XYZ, ADAPTIVE, WEST_FIRST,
                                #          NORTH_LAST, MINIMAL, VALIANT, TREE_BASED

  # Topology parameters
  num_rows: 8
  num_cols: 8
  num_layers: 1                 # For 3D topologies

  # Virtual Networks and Virtual Channels
  virtual_networks: 2           # Message classes (e.g., req/resp)
  virtual_channels_per_vn: 2    # VCs per VN for deadlock avoidance

  # Link parameters
  link_width_bytes: 8           # 64-bit links
  link_latency: 1               # cycles

  # Router configuration
  router_pipeline: FULL         # Options: FULL, REDUCED, SIMPLE, MINIMAL
  router_latency: 0             # 0 = use pipeline stages
  enable_router_bypass: false

  # Buffer configuration
  input_buffer_depth: 4
  output_buffer_depth: 4

# ----------------------------------------------------------------------------
# Workload Configuration
# ----------------------------------------------------------------------------
workload:
  type: "vector_add"
  size: 1048576                 # 1M elements

# ----------------------------------------------------------------------------
# Output Configuration
# ----------------------------------------------------------------------------
output:
  results_dir: "results/"
  verbose: true
  generate_stats: true

# ============================================================================
# Example Configurations for Different Use Cases
# ============================================================================

# --- Use Case 1: High-Performance Computing ---
# pim:
#   pe_type: "VectorPE"
#   scheduler: "DataLocalityScheduler"
# memory:
#   technology: "HBM2"
# network:
#   topology: FAT_TREE

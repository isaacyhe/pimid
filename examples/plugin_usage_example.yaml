# network:
#   topology: CROSSBAR
#   routing: MINIMAL

# ============================================================================
# Notes on Plugin Development
# ============================================================================
#
# To create your own plugin:
#
# 1. Choose the plugin type (PE, Scheduler, Memory, or Network)
# 2. Inherit from the appropriate base class:
#    - PE: pimid::plugin::PEPluginBase
#    - Scheduler: pimid::plugin::SchedulerPluginBase
#    - Memory: pimid::plugin::MemoryModelPluginBase
#    - Network: Extend GarnetModel or NetworkModel
#
# 3. Implement required methods (see header files for details)
# 4. Register your plugin with extern "C" pimid_register_plugin()
# 5. Build as a shared library (.so)
# 6. Add to loaded_plugins above
#
# For detailed examples, see:
# - pimid/include/plugin/pe_plugin.h
# - pimid/include/plugin/scheduler_plugin.h
# - pimid/include/plugin/memory_model_plugin.h
# - pimid/network_models/include/network_model.h
#
# ============================================================================

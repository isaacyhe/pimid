# STENCIL1D Benchmark Configuration - Bank-Level with In-Order Core PE
# Memory Technology: STTMRAM

benchmark:
  name: "STENCIL1D_Bank_InOrder_STTMRAM"
  description: "1D Stencil with bank-level In-Order Core PE on STT-MRAM"
  workload_type: "stencil1d"

# Workload parameters
workload:
  array:
    size: 1048576  # 1M elements
    data_type: "float32"

  stencil1d:
    radius: 2  # 5-point stencil
    num_iterations: 100

# Memory configuration
memory:
  technology: "STTMRAM"
  config_file: "configs/memory/sttmram_config.yaml"

  hierarchy:
    num_banks: 4
    num_subarrays_per_bank: 4
  # STTMRAM-specific timing
  timing:
    subarray_read_ns: 6.0
    subarray_write_ns: 30.0
    inner_bank_htree_ns: 8.65

# Processing element configuration
processing_element:
  type: "in_order_core"
  placement_level: "BANK"
  num_pes: 4  # One per bank

  pipeline:
    stages: 5
    fetch_decode_ns: 2.0
    execute_compare_ns: 1.0
    execute_alu_ns: 1.0
    memory_access_ns: 1.0
    writeback_ns: 0.5
    branch_penalty_ns: 3.0
    branch_prediction_accuracy: 0.5

  energy:
    fetch_decode_pj: 10.0
    alu_pj: 5.0
    branch_pj: 8.0

# Simulation control
simulation:
  max_cycles: 1000000000
  enable_power_modeling: true
  enable_detailed_stats: true

# Output configuration
output:
  stats_file: "results/stencil1d_bank_inorder_sttmram_stats.txt"
  detailed_log: "results/stencil1d_bank_inorder_sttmram_detailed.log"
  summary_format: "table"

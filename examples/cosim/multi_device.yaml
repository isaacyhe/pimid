# Multi-device host-device co-simulation reference config.
#
# 1 host + 2 PIM devices over a PCIe Gen5 system network. Models a board with
# two PIM accelerators that the host can address independently.
#
# Run with:
#   ./build/pimid --method exec --scope system \
#       --config configs/cosim/multi_device.yaml \
#       --workload test/benchmarks/host_device_cosim/reduction_tree_cosim \
#       1024 4 0

scope: system

system:
  hosts:
    - name: host
      core_type: ooo_core
      num_cores: 1
      frequency_mhz: 2000
      tech_node_nm: 22
      cache:
        l1d_kb: 32
        l1i_kb: 32
        l2_kb: 256
      memory:
        technology: SRAM

  devices:
    - name: device0
      type: compute
      attachment: pcie_gen5
      frequency_mhz: 2000
      tech_node_nm: 22
      pe_type: alu_core
      num_pes: 4
      pim:
        placement:
          level: BANK
        mc:
          type: simple
      memory:
        technology: SRAM
      noc:
        topology: MESH_2D
        model: simple

    - name: device1
      type: compute
      attachment: pcie_gen5
      frequency_mhz: 2000
      tech_node_nm: 22
      pe_type: alu_core
      num_pes: 4
      pim:
        placement:
          level: BANK
        mc:
          type: simple
      memory:
        technology: SRAM
      noc:
        topology: MESH_2D
        model: simple

  network:
    topology: crossbar
    model: simple

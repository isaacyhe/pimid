# LPDDR5 DRAM with GARNET H-tree Internal Network Configuration
# Memory Technology: LPDDR5 (Low Power DDR5 for mobile)
# Topology: H-tree (hierarchical tree for subarray interconnect)

dram:
  type: "LPDDR5"
  organization:
    num_subarrays: 16
    num_banks: 4
    num_bank_groups: 4
    num_chips: 8

  # Timing parameters (ns)
  timing:
    tCK: 0.5       # LPDDR5-6400 clock period
    tCL: 18        # CAS latency
    tRCD: 18       # RAS to CAS delay
    tRP: 18        # Precharge time
    tRAS: 36       # Row active time

# GARNET H-tree Network Configuration
network:
  topology: "H_TREE"
  model: "GARNET"

  # Virtual Networks (VN) - Message Classes
  virtual_networks: 2  # VN0: Reads, VN1: Writes

  # Virtual Channels (VC) per VN - Deadlock Avoidance
  virtual_channels_per_vn: 1

  # Router Pipeline Complexity - MINIMAL for DRAM
  router_pipeline: "MINIMAL"

  # Router latency (cycles)
  router_latency: 1

  # Router bypass optimization
  enable_router_bypass: true

  # Buffer depths (even more minimal for mobile)
  input_buffer_depth: 2
  output_buffer_depth: 2

  # Link parameters - Subarray level
  subarray_network:
    link_width_bits: 64    # LPDDR5: 8-byte prefetch (like DDR4)
    frequency_GHz: 1.6     # Lower power, moderate speed
    latency_cycles: 5

  # Link parameters - Bank level
  bank_network:
    link_width_bits: 8
    frequency_GHz: 1.6
    latency_cycles: 10

  # Link parameters - Bank Group level
  bank_group_network:
    link_width_bits: 8
    frequency_GHz: 1.6
    latency_cycles: 15

  # Link parameters - Chip level
  chip_network:
    link_width_bits: 8
    frequency_GHz: 1.6
    latency_cycles: 20
